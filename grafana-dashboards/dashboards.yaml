---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k3s-overview.json: |
    {
      "uid": "homelab-k3s-overview",
      "title": "Homelab / K3s overview",
      "tags": ["homelab", "k3s"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Ready nodes", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 2, "type": "stat", "title": "Running pods", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{phase=\"Running\"})"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}}, "overrides": []}
        },
        {
          "id": 3, "type": "stat", "title": "Unhealthy pods", "description": "Pending, failed, or unknown pods.", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}}, "overrides": []}
        },
        {
          "id": 4, "type": "stat", "title": "Container restarts (24h)", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total[24h]))"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}}, "overrides": []}
        },
        {
          "id": 5, "type": "timeseries", "title": "Node CPU utilisation", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "targets": [{"refId": "A", "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "id": 6, "type": "timeseries", "title": "Node memory utilisation", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "targets": [{"refId": "A", "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "color": {"mode": "palette-classic"}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}
        },
        {
          "id": 7, "type": "table", "title": "Top restarting containers (24h)", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 13},
          "targets": [{"refId": "A", "expr": "topk(10, sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[24h])))", "format": "table", "instant": true}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}}, "overrides": []},
          "options": {"showHeader": true, "cellHeight": "sm"}
        }
      ]
    }
  trivy-security-overview.json: |
    {
      "uid": "homelab-trivy-security",
      "title": "Homelab / Trivy security",
      "tags": ["homelab", "security", "trivy"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": {"from": "now-7d", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Critical vulnerabilities", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0}, "targets": [{"refId": "A", "expr": "sum(trivy_image_vulnerabilities{severity=\"Critical\"})"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 2, "type": "stat", "title": "High vulnerabilities", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0}, "targets": [{"refId": "A", "expr": "sum(trivy_image_vulnerabilities{severity=\"High\"})"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 3, "type": "stat", "title": "Config audit findings", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0}, "targets": [{"refId": "A", "expr": "sum(trivy_resource_configaudits)"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}}, "overrides": []}
        },
        {
          "id": 4, "type": "stat", "title": "Exposed secrets", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0}, "targets": [{"refId": "A", "expr": "sum(trivy_image_exposedsecrets)"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "background"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 5, "type": "bargauge", "title": "Image vulnerabilities by severity", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5}, "targets": [{"refId": "A", "expr": "sum(trivy_image_vulnerabilities) by (severity)", "legendFormat": "{{severity}}", "instant": true}],
          "options": {"displayMode": "gradient", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "showUnfilled": true},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 10}]}}, "overrides": []}
        },
        {
          "id": 6, "type": "table", "title": "Vulnerabilities by namespace", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5}, "targets": [{"refId": "A", "expr": "sum(trivy_image_vulnerabilities) by (namespace, severity)", "format": "table", "instant": true}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 10}]}}, "overrides": []}, "options": {"showHeader": true, "cellHeight": "sm"}
        },
        {
          "id": 7, "type": "table", "title": "Critical images to fix first", "description": "Select an image here, then inspect its matching VulnerabilityReport for the CVE and fixed package version.", "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 13}, "targets": [{"refId": "A", "expr": "topk(20, sum(trivy_image_vulnerabilities{severity=\"Critical\"}) by (namespace, image_repository, image_tag))", "format": "table", "instant": true}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}, "options": {"showHeader": true, "cellHeight": "sm"}
        }
      ]
    }
