apiVersion: apps/v1
kind: Deployment
metadata:
  name: warpgate
spec:
  # A shared SQLite PVC must never be opened by overlapping rollout replicas.
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: warpgate-setup
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: warpgate
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /@warpgate/api/info
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /@warpgate/api/info
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /@warpgate/api/info
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
