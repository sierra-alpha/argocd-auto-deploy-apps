# Match Homepage's working Ingress: the Warpgate HTTPS redirect is the only
# middleware on the active route. In particular, do not attach the legacy
# client-IP allowlist: in this setup it rejected legitimate LAN clients (403).
# LAN-only reachability must be enforced outside Traefik (no WAN forward).
# Same standard Kubernetes Ingress pattern used by homepage.
# Local DNS resolves *.app.sierraalpha.co.nz to the existing Traefik ingress.
# The existing Tailscale Service proxy remains available for tailnet HTTPS/SSH.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: warpgate
  namespace: warpgate
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirecthttps@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: warpgate.app.sierraalpha.co.nz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: warpgate
                port:
                  number: 443
  tls:
    - hosts:
        - warpgate.app.sierraalpha.co.nz
      secretName: warpgate-tls
---
# Legacy allowlist is retained only for the retired IngressRoute below.
# The active Kubernetes Ingress above does NOT reference this Middleware.
# Automated pruning is off; avoid removing resources without a safe cleanup.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: warpgate-lan-only
  namespace: warpgate
spec:
  ipAllowList:
    sourceRange:
      - 192.168.1.0/24
---
# Port 443 on the Warpgate Service terminates TLS in the Warpgate pod.
# Traefik must use the certificate DNS hostname as SNI, not the pod IP.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: warpgate-verified-upstream
  namespace: warpgate
spec:
  serverName: warpgate.app.sierraalpha.co.nz
---
# Retirement marker for the old IngressRoute. ArgoCD has automated prune=false,
# so deleting the former resource from Git would leave an active stale route.
# Keep the resource with an unrelated hostname until a controlled manual prune.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: warpgate-lan
  namespace: warpgate
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`retired-warpgate-route.invalid`)
      middlewares:
        - name: warpgate-lan-only
      services:
        - name: warpgate
          port: 443
          scheme: https
          serversTransport: warpgate-verified-upstream
  tls:
    secretName: warpgate-tls
