metadata:
  name: warpgate
  labels:
    helm.sh/chart: warpgate-0.1.0
    app.kubernetes.io/name: warpgate
    app.kubernetes.io/instance: warpgate
    app.kubernetes.io/version: "0.29.0"
    app.kubernetes.io/managed-by: Helm
---
# Source: warpgate/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: warpgate-config-overrides
  labels:
    helm.sh/chart: warpgate-0.1.0
    app.kubernetes.io/name: warpgate
    app.kubernetes.io/instance: warpgate
    app.kubernetes.io/version: "0.29.0"
    app.kubernetes.io/managed-by: Helm
data:
  warpgate.yaml: |

    database_url: sqlite:/data/db
    http:
      listen: 0.0.0.0:8888
      certificate: /tls-cert/tls.crt
      key: /tls-cert/tls.key
    ssh:
      enable: true
      listen: 0.0.0.0:2222
    mysql:
      enable: false
    postgres:
      enable: false
    kubernetes:
      enable: false
    rdp:
      enable: false
    vnc:
      enable: false
    recordings:
      enable: true
      path: /data/recordings
---
