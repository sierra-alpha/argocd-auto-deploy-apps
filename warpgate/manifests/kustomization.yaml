apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: warpgate
resources:
- namespace.yaml
- upstream.yaml
- network-policy.yaml
- lan-ingress.yaml
- secrets.yaml
- certificate.yaml
- storage.yaml
patches:
- path: deployment-patch.yaml
- target:
    kind: ServiceAccount
    name: warpgate
  patch: "- op: add\n  path: /automountServiceAccountToken\n  value: false"
