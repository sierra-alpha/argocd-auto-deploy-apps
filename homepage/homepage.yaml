apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Home
    theme: dark
    color: slate
    layout:
      Household:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 3
      Observability:
        style: row
        columns: 3
      Automation:
        style: row
        columns: 3
  services.yaml: |
    - Household:
        - Audiobookshelf:
            icon: audiobookshelf.png
            href: https://audiobookshelf.app.sierraalpha.co.nz
            description: Audiobooks and podcasts
    - Infrastructure:
        - Argo CD:
            icon: argo-cd.png
            description: GitOps deployments
        - Kubernetes:
            icon: kubernetes.png
            description: Cluster workloads
    - Observability:
        - Grafana:
            icon: grafana.png
            description: Metrics and dashboards
    - Automation:
        - AI Whisperer:
            icon: github.png
            href: https://github.com/sierra-alpha/ai-whisperer
            description: Tasks and pull requests
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - datetime:
        text_size: md
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
  bookmarks.yaml: |
    - Projects:
        - AI Whisperer:
            - href: https://github.com/sierra-alpha/ai-whisperer
              description: Automation engine
  docker.yaml: |
    {}
  kubernetes.yaml: |
    mode: disabled
  custom.css: ""
  custom.js: ""
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app: homepage
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rasomniac
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.app.sierraalpha.co.nz
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 3000
              httpHeaders:
                - name: Host
                  value: homepage.app.sierraalpha.co.nz
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: homepage-config
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirecthttps@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: homepage.app.sierraalpha.co.nz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
  tls:
    - hosts:
        - homepage.app.sierraalpha.co.nz
      secretName: homepage-app-sierraalpha-tls
