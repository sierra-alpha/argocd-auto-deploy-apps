apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: podsort-audiobookshelf
  namespace: audiobookshelf
spec:
  itemPath: "vaults/K8s Service Account/items/podsort-audiobookshelf"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podsort
  namespace: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels: {app: podsort}
  template:
    metadata:
      labels: {app: podsort}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: podsort
          image: python:3.12-slim
          command: ["/bin/sh", "-ec"]
          args: ["pip install --disable-pip-version-check --no-cache-dir --target /tmp/python-deps 'fastapi==0.115.12' 'uvicorn==0.34.2' && exec python -m uvicorn rss_sorter:app --host 0.0.0.0 --port 8080"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          env:
            - {name: PYTHONPATH, value: /app:/tmp/python-deps}
            - {name: RSS_UPSTREAM_ORIGIN, value: http://audiobookshelf.audiobookshelf.svc.cluster.local}
            - {name: PODSORT_PUBLIC_ORIGIN, value: https://podsort.app.sierraalpha.co.nz}
            - name: AUDIOBOOKSHELF_API_TOKEN
              valueFrom: {secretKeyRef: {name: podsort-audiobookshelf, key: api-token}}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 25m, memory: 96Mi}, limits: {cpu: 250m, memory: 256Mi}}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: code
          configMap: {name: podsort-code}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: podsort, namespace: audiobookshelf}
spec:
  selector: {app: podsort}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podsort
  namespace: audiobookshelf
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirecthttps@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: podsort.app.sierraalpha.co.nz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: podsort, port: {number: 80}}}
  tls:
    - hosts: [podsort.app.sierraalpha.co.nz]
      secretName: podsort-app-sierraalpha-tls
