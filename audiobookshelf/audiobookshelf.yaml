---
#
# Ingress
#
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares:
      traefik-redirecthttps@kubernetescrd
  labels:
    app: audiobookshelf
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  ingressClassName: traefik
  rules:
  - host: audiobookshelf.app.sierraalpha.co.nz
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: audiobookshelf
            port:
              number: 80
  tls:
  - hosts:
    - audiobookshelf.app.sierraalpha.co.nz
    secretName: audiobookshelf-app-sierraalpha-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: audiobookshelf
  name: audiobookshelf-tailscale
  namespace: audiobookshelf
spec:
  defaultBackend:
    service:
      name: audiobookshelf
      port:
        number: 80
  ingressClassName: tailscale
  tls:
    - hosts:
        - audiobookshelf
---
apiVersion: v1
kind: Service
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  ports:
    - port: 80
      protocol: TCP
  selector:
    app: audiobookshelf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  selector:
    matchLabels:
      app: audiobookshelf
  replicas: 1
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      affinity:
        nodeAffinity:
          # Hard-pinned to prosomniac: audiobookshelf's own database
          # (/mnt/disks/k8s-local-data/audiobookshelf/config/absdatabase.sqlite — users,
          # sign-in sessions, listening progress) is node-local, not on the shared S3 mount
          # like the other volumes. Failing over to another node would present an empty
          # config dir and look like a fresh install. No preferredDuringScheduling fallback
          # here on purpose — see ttser CronJob below for the failover-capable pattern.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - prosomniac
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              rm -rf /audiobooks /metadata /podcasts
              ln -s /mnt/disks/k8s-data-encrypted/audiobookshelf/audiobooks /audiobooks
              ln -s /mnt/disks/k8s-data-encrypted/audiobookshelf/metadata /metadata
              ln -s /mnt/disks/k8s-data-encrypted/audiobookshelf/podcasts /podcasts
              exec tini -- node index.js
          ports:
          - containerPort: 80
          volumeMounts:
            - name: audiobookshelf-config-volume
              mountPath: /config
            - name: audiobookshelf-disks-volume
              mountPath: /mnt/disks
              mountPropagation: HostToContainer
      volumes:
        - name: audiobookshelf-config-volume
          hostPath:
            path: /mnt/disks/k8s-local-data/audiobookshelf/config
        - name: audiobookshelf-disks-volume
          hostPath:
            path: /mnt/disks
---
#
# ttser
#
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ttser
  namespace: audiobookshelf
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      backoffLimit: 0
      # Kill a wedged run before the next hourly schedule fires, rather than
      # relying solely on concurrencyPolicy: Replace to clean it up.
      activeDeadlineSeconds: 3300
      template:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - rasomniac
                          - obsidian
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - prosomniac
          containers:
            - name: ttser
              image: ghcr.io/sierra-alpha/voicemail
              env:
                - name: GMAIL_APP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: machines-google-password
                      key: app-password
              volumeMounts:
                - name: ttser-config
                  mountPath: /config.yaml
                  subPath: config.yaml
                - name: audiobookshelf-podcasts-volume
                  mountPath: /podcasts
          restartPolicy: OnFailure
          volumes:
            - name: ttser-config
              configMap:
                name: ttser-configmap
            - name: audiobookshelf-podcasts-volume
              hostPath:
                path: /mnt/disks/k8s-data-encrypted/audiobookshelf/podcasts
