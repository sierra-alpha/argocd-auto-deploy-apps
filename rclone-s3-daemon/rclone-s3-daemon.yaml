---
#
# Secrets for upload
#
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: k8s-data-rclone-config
  namespace: rclone-s3-daemon
spec:
  itemPath:
    "vaults/K8s Service Account/items/rclone-config-upload-wasabi-k8s-data-encrypted"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rclone-s3
  namespace: rclone-s3-daemon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rclone-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rclone-s3
    spec:
      containers:
      - name: rclone-s3
        image: rclone/rclone:1
        command:
        - '/bin/sh'
        args:
        - '-c'
        - |
          set -eu
          fusermount -uz /mnt/disks/k8s-data-encrypted 2>/dev/null || umount -l /mnt/disks/k8s-data-encrypted 2>/dev/null || true
          mkdir -p /mnt/disks/k8s-data-encrypted
          exec rclone \
            --config=/.config/rclone/rclone.conf \
            mount \
            --allow-non-empty \
            --allow-other \
            k8s-data-encrypted: \
            /mnt/disks/k8s-data-encrypted
        env:
        - name: RCLONE_VERBOSE
          value: '2'
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh","-c","fusermount -uz /mnt/disks/k8s-data-encrypted"]
        livenessProbe:
          exec:
            # Reading the mount can be served from rclone's directory cache. Query the
            # remote itself so an unreachable backend causes a clean FUSE remount.
            command: ["/bin/sh","-c","timeout 15 rclone --config=/.config/rclone/rclone.conf lsf k8s-data-encrypted: --max-depth 1 >/dev/null"]
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 20
          failureThreshold: 3
        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
        volumeMounts:
        - name: rclone-conf-dir
          mountPath: /.config/rclone
        - name: media
          mountPath: /mnt/disks
          mountPropagation: Bidirectional
      volumes:
      - name: rclone-conf-dir
        secret:
          secretName: k8s-data-rclone-config
      - name: media
        hostPath:
          path: /mnt/disks
          type: DirectoryOrCreate
